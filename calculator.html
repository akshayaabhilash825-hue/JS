<!DOCTYPE html>
<html>

<head> <title></title></head>
<body>
    <script>
let purchases = 0;

while (purchases < 5) {
    let code = parseInt(prompt("Enter product code (1-3):"));
    let qty = parseInt(prompt("Enter quantity:"));

    let price = 0;
    let product = "";

    
    switch (code) {
        case 1:
            product = "Apple";
            price = 30 * qty;
            break;
        case 2:
            product = "Banana";
            price = 10 * qty;
            break;
        case 3:
            product = "Mango";
            price = 50 * qty;
            break;
        default:
            alert("Invalid product code. Skipping...");
            continue; 
    }

    console.log(product + " total price: ₹" + price);

    
    if (price > 100) {
console.log("High purchase");
    } else {
        console.log("Normal purchase");
    }

    purchases++;
}
</script>
</body>
</html>
