<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sanitizeComment(comment) {
  
  const regex = /\d+/g;

  
  const hasNumber = regex.test(comment);

  
  const updatedComment = comment.replace(regex, "NUMBER");

  return {
    hasNumber: hasNumber,
    updatedComment: updatedComment
  };
}


const testComment = "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";
const result = sanitizeComment(testComment);

console.log("Number found:", result.hasNumber);
console.log("Updated comment:", result.updatedComment);

    </script>
</body>
</html>
